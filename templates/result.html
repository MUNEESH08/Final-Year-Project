<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link rel="stylesheet" href="static/result.css">
</head>
<body>
    <h2>✅ Process Completed</h2>
    <div class="result-box">
        <h3>📜 Extracted Text</h3>
        <pre>{{ extracted_text }}</pre>

        <h3>📝 Summarized Text (English)</h3>
        <pre>{{ summarized_text }}</pre>

        <h3>🌐 Tamil Translation</h3>
        <pre>{{ tamil_text }}</pre>

        <h3>🔊 English Audio</h3>
        <audio controls>
            <source src="{{ url_for('download', filename=english_audio_file) }}" type="audio/mpeg">
        </audio>
        <br>
        <a href="{{ url_for('download', filename=english_audio_file) }}">⬇️ Download English Audio</a>

        <h3>🔊 Tamil Audio</h3>
        <audio controls>
            <source src="{{ url_for('download', filename=tamil_audio_file) }}" type="audio/mpeg">
        </audio>
        <br>
        <a href="{{ url_for('download', filename=tamil_audio_file) }}">⬇️ Download Tamil Audio</a>
    </div>
</body>
</html>
